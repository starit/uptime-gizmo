name: Nightly Release

on:
  schedule:
    # Every other day at 2:00 AM UTC. Day-of-month stepping means the 31st and
    # the 1st fall a day apart rather than two, which the window below covers.
    - cron: "0 2 */2 * *"
  workflow_dispatch: # Allow manual trigger

permissions: {}

jobs:
  # A nightly of yesterday's nightly is not worth publishing. mark-as-nightly
  # stamps the version with the build time, so an unchanged tree still produces
  # a different image every day, and anything watching the tag pulls it.
  check:
    # Only run on the original repository, not on forks
    if: github.repository == 'starit/uptime-gizmo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.recent.outputs.build }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          # The default shallow clone holds one commit, which would make the
          # window below look empty on every run.
          fetch-depth: 100

      - name: Look for commits since the last nightly
        id: recent
        run: |
          # One day longer than the gap between runs, so the window always
          # overlaps the previous one. Scheduled runs are queued and start late,
          # and a window equal to the interval would drop whatever landed in the
          # drift. If the schedule changes, this has to change with it.
          if [ -n "$(git log --since='3 days ago' --oneline)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last three days, so there is nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-nightly:
    needs: check
    if: github.repository == 'starit/uptime-gizmo' && (needs.check.outputs.build == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with: { persist-credentials: false }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      #    Tempoary disable until we understand TanStack npm supply-chain compromise
      #      - name: Cache/Restore node_modules
      #        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      #        id: node-modules-cache
      #        with:
      #          path: node_modules
      #          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - name: Run release-nightly
        run: pnpm run release-nightly
