name: New contributor message

on:
  # Safety
  # This workflow uses pull_request_target so it can run with write permissions on first-time contributor PRs.
  # It is safe because it does not check out or execute any code from the pull request and
  # only uses the pinned, trusted plbstl/first-contribution action
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  build:
    if: github.repository == 'starit/uptime-gizmo'
    name: Hello new contributor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: plbstl/first-contribution@4b2b042fffa26792504a18e49aa9543a87bec077 # v4.1.0
        with:
          pr-reactions: rocket
          pr-opened-msg: |
            Thanks for the pull request, and welcome. ⚙️

            Since this is your first one here, the [Pull Request guidelines](https://github.com/starit/uptime-gizmo/blob/main/CONTRIBUTING.md#pull-requests) are worth a look. The two things that save the most back and forth:

            - Keep it as a Draft while you are still working, and mark it Ready for review when it is done.
            - Run `pnpm run lint` before pushing.

            If anything about the design or the process is unclear, ask right here. Unclear documentation is a bug too.
          pr-merged-msg: |
            @{fc-author} your first contribution is merged. ⚙️ Thank you.

            It ships in the next nightly image, which you can find under [tags on Docker Hub](https://hub.docker.com/r/starit/uptime-gizmo/tags).

            Uptime is money, friend.
